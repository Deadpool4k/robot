<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena - Proiector</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .container { text-align: center; }
        .qr-wrapper { background: white; padding: 30px; border-radius: 20px; }
        canvas { width: 300px; height: 300px; }
        h1 { color: white; margin-top: 30px; font-size: 1.5rem; }
        .video-wrapper, .blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .blackout { z-index: 999; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="qr-wrapper"><canvas id="qrcode"></canvas></div>
        <h1>SCANEAZĂ PENTRU A INTRĂ ÎN ARENĂ</h1>
    </div>
    <div class="blackout" id="blackout"></div>
    <div class="video-wrapper" id="videoWrapper">
        <video id="eventVideo" preload="auto" playsinline muted></video>
    </div>

    <script>
        const socket = io();
        socket.emit('register', 'projector');

        fetch('/api/qr-data').then(res=>res.json()).then(data=>{
            QRCode.toCanvas(document.getElementById('qrcode'), data.url, { width: 300 });
        });

        const video = document.getElementById('eventVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const blackoutDiv = document.getElementById('blackout');
        const appDiv = document.getElementById('app');

        // Suport R2: încarcă URL-ul din config dacă există
        fetch('/api/config')
            .then(r => r.json())
            .catch(() => ({}))
            .then(cfg => {
                video.src = cfg.videoUrl || '/0501.mp4';
                video.load();
            });

        // Funcție showVideo cu suport pentru sincronizare (time)
        function showVideo(data) {
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'block';
            
            // Sincronizare: sare la timpul potrivit dacă vine cu delay
            const seekTo = (data && typeof data.time === 'number') ? data.time : 0;
            if (seekTo > 0 && Math.abs(video.currentTime - seekTo) > 0.5) {
                video.currentTime = seekTo;
            }
            
            // Logica originală care funcționa cu sunet
            video.play().then(() => {
                setTimeout(() => { video.muted = false; }, 100);
            }).catch(e => console.log('Video play error:', e));
        }

        // Socket events cu suport pentru sincronizare
        socket.on('sync-state', (state) => {
            console.log('Sync state:', state);
            if (state.blackout) { 
                appDiv.classList.add('hidden'); 
                blackoutDiv.style.display = 'block'; 
            } else {
                blackoutDiv.style.display = 'none';
            }
            
            if (state.videoPlaying) {
                // Folosește videoTime pentru sincronizare
                showVideo({ time: state.videoTime || 0 });
            }
        });
        
        socket.on('blackout', () => { 
            appDiv.classList.add('hidden'); 
            blackoutDiv.style.display = 'block'; 
        });
        
        socket.on('play-video', (data) => {
            // Poate primi { time: x } de la server
            showVideo(data || { time: 0 });
        });
        
        socket.on('restart', () => {
            appDiv.classList.remove('hidden');
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'none';
            video.pause();
            video.currentTime = 0;
            video.muted = true;
        });

        // Fullscreen la orice click (asta deblochează și sunetul indirect)
        document.body.addEventListener('click', () => {
            document.documentElement.requestFullscreen().catch(() => {});
        });
        document.body.addEventListener('touchstart', () => {
            document.documentElement.requestFullscreen().catch(() => {});
        });
    </script>
</body>
</html>
