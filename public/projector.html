<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena - Proiector</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .container { text-align: center; }
        .qr-wrapper { background: white; padding: 30px; border-radius: 20px; }
        #qrcode { display: flex; justify-content: center; align-items: center; }
        #qrcode img { width: 300px; height: 300px; }
        h1 { color: white; margin-top: 30px; font-size: 1.5rem; }
        .video-wrapper, .blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .blackout { z-index: 999; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="qr-wrapper"><div id="qrcode"></div></div>
        <h1>SCANEAZĂ PENTRU A ACCESA QUIZZ-UL</h1>
    </div>
    <div class="blackout" id="blackout"></div>
    <div class="video-wrapper" id="videoWrapper">
        <video id="eventVideo" preload="auto" playsinline muted></video>
    </div>

    <script>
        const socket = io();
        socket.emit('register', 'projector');

        fetch('/api/qr-code')
            .then((res) => {
                if (!res.ok) throw new Error('qr_request_failed');
                return res.json();
            })
            .then((data) => {
                if (!data?.qrDataUrl) throw new Error('invalid_qr_payload');
                const qrDiv = document.getElementById('qrcode');
                qrDiv.innerHTML = '';
                const img = document.createElement('img');
                img.alt = 'QR Code';
                img.src = data.qrDataUrl;
                qrDiv.appendChild(img);
            })
            .catch(err => console.error('QR error:', err));

        const video = document.getElementById('eventVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const blackoutDiv = document.getElementById('blackout');
        const appDiv = document.getElementById('app');

        fetch('/api/config')
            .then(r => r.json())
            .catch(() => ({}))
            .then(cfg => {
                const url = (cfg?.videoUrl || '').toString().trim();
                if (!url) {
                    console.warn('VIDEO_URL missing; projector video playback disabled until configured.');
                    return;
                }
                video.src = encodeURI(url);
                video.load();
            });

        let pendingVideoPlay = false;
        function showVideo(startTime = 0) {
            if (!video.src) {
                console.warn('play-video ignored: no configured video source.');
                return;
            }
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'block';
            if (Number.isFinite(startTime) && startTime > 0) {
                try {
                    video.currentTime = startTime;
                } catch {}
            }
            video.muted = true;
            pendingVideoPlay = true;
            const tryPlay = () => video.play().then(() => {
                pendingVideoPlay = false;
                setTimeout(() => { video.muted = false; }, 100);
            }).catch((e) => {
                console.log('Video play error:', e);
            });
            tryPlay();

            const resume = () => {
                if (!pendingVideoPlay) return;
                tryPlay();
            };
            document.body.addEventListener('click', resume, { once: true, passive: true });
            document.body.addEventListener('touchstart', resume, { once: true, passive: true });
        }

        let lastRecoverAt = 0;
        function recoverVideoPlayback() {
            const now = Date.now();
            if (now - lastRecoverAt < 1500) return;
            lastRecoverAt = now;
            if (videoWrapper.style.display !== 'block') return;
            video.play().catch(() => {
                try {
                    video.load();
                    video.play().catch(() => {});
                } catch {}
            });
        }
        video.addEventListener('stalled', recoverVideoPlayback);
        video.addEventListener('waiting', recoverVideoPlayback);
        video.addEventListener('error', recoverVideoPlayback);

        socket.on('sync-state', (state) => {
            if (state.blackout) { appDiv.classList.add('hidden'); blackoutDiv.style.display = 'block'; }
            if (state.videoPlaying) showVideo(state.videoTime || 0);
        });
        socket.on('blackout', () => { appDiv.classList.add('hidden'); blackoutDiv.style.display = 'block'; });
        socket.on('play-video', (payload = {}) => showVideo(payload.time || 0));
        socket.on('restart', () => {
            appDiv.classList.remove('hidden');
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'none';
            video.pause();
            video.currentTime = 0;
            video.muted = true;
        });

        document.body.addEventListener('click', () => {
            document.documentElement.requestFullscreen().catch(() => {});
        });
        document.body.addEventListener('touchstart', () => {
            document.documentElement.requestFullscreen().catch(() => {});
        });
    </script>
</body>
</html>
