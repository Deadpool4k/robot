<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena - Proiector</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .container { text-align: center; }
        .qr-wrapper { background: white; padding: 30px; border-radius: 20px; }
        canvas { width: 300px; height: 300px; }
        h1 { color: white; margin-top: 30px; font-size: 1.5rem; }
        .video-wrapper, .blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .audio-overlay { position: fixed; inset: 0; display: none; z-index: 1100; background: rgba(0,0,0,0.55); color: #fff;
            font-family: 'Courier New', monospace; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .audio-overlay .btn { margin-top: 16px; display: inline-block; background: #fff; color: #000; padding: 14px 18px; border-radius: 14px; font-weight: 700; }
        .blackout { z-index: 999; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="qr-wrapper"><canvas id="qrcode"></canvas></div>
        <h1>SCANEAZĂ PENTRU A INTRĂ ÎN ARENĂ</h1>
    </div>
    <div class="blackout" id="blackout"></div>
    <div class="video-wrapper" id="videoWrapper"><video id="eventVideo" preload="auto" playsinline webkit-playsinline muted autoplay></video></div>
    <div class="audio-overlay" id="audioOverlay">
        <div>
            <div style="font-size:20px;font-weight:700;">ACTIVEAZĂ SUNETUL</div>
            <div style="opacity:0.85;margin-top:8px;">Browserul cere un click pentru audio.</div>
            <div class="btn">CLICK PENTRU SUNET</div>
        </div>
    </div>

    <script>
        const socket = io();
        socket.emit('register', 'projector');

        fetch('/api/qr-data')
            .then(res => res.json())
            .then(data => {
                QRCode.toCanvas(document.getElementById('qrcode'), data.url, { width: 300 });
            })
            .catch(err => console.error(err));

        const video = document.getElementById('eventVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const blackoutDiv = document.getElementById('blackout');
        const appDiv = document.getElementById('app');
        const audioOverlay = document.getElementById('audioOverlay');

        video.src = '/0501.mp4';
        video.playsInline = true;
        video.muted = true;
        video.autoplay = true;
        video.load();

        let userInteracted = false;
        let audioUnlocked = false;
        function onUserGesture() {
            userInteracted = true;
            audioUnlocked = true; // remember intent; don't start playback now
            if (videoWrapper.style.display === 'block') {
                tryEnableAudio();
            }
        }

        function tryEnableAudio() {
            if (!audioUnlocked) return;
            video.muted = false;
            video.volume = 1;
            video.play().catch(() => {});
            audioOverlay.style.display = 'none';
        }

        function updateAudioOverlay() {
            const shouldShow = videoWrapper.style.display === 'block' && video.muted;
            audioOverlay.style.display = shouldShow ? 'flex' : 'none';
        }

        function syncAndShowVideo(payload) {
            console.log('play-video payload', payload);
            const nowMs = payload?.nowMs ?? Date.now();
            const startAtMs = payload?.videoStartAtMs ?? null;
            const elapsedSec = (startAtMs ? Math.max(0, (nowMs - startAtMs) / 1000) : 0);

            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'block';
            updateAudioOverlay();
            // Autoplay on mobile requires muted; keep muted.
            video.muted = true;
            try { video.currentTime = elapsedSec; } catch (_) {}
            video.play().catch(e => console.error(e));
            tryEnableAudio();
            updateAudioOverlay();
        }

        let userInteracted = false;
        function onUserGesture() {
            userInteracted = true;
            if (videoWrapper.style.display === 'block') {
                video.muted = false;
                video.play().catch(() => {});
            }
        }

        video.addEventListener('error', () => {
            const err = video.error;
            console.error('Video error', err);
            blackoutDiv.style.display = 'block';
            blackoutDiv.innerHTML = '<div style="color:#fff;font-family:Courier New, monospace;display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px;">VIDEO NU POATE FI ÎNCĂRCAT.<br>Verifică dacă <b>/0501.mp4</b> există în <b>public/</b>.</div>';
        });

        socket.on('sync-state', (state) => {
            if (state.blackout) { appDiv.classList.add('hidden'); blackoutDiv.style.display = 'block'; }
            if (state.videoPlaying) {
                appDiv.classList.add('hidden');
                syncAndShowVideo(state);
            }
        });
        socket.on('blackout', () => { appDiv.classList.add('hidden'); blackoutDiv.style.display = 'block'; });
        socket.on('play-video', (payload) => {
            appDiv.classList.add('hidden');
            syncAndShowVideo(payload);
        });
        socket.on('restart', () => {
            appDiv.classList.remove('hidden');
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'none';
            audioOverlay.style.display = 'none';
            video.pause();
            video.currentTime = 0;
            video.muted = true;
        });

        audioOverlay.addEventListener('click', () => { onUserGesture(); }, { passive: true });
        video.addEventListener('volumechange', updateAudioOverlay);
        video.addEventListener('play', updateAudioOverlay);
        video.addEventListener('pause', updateAudioOverlay);

        document.body.addEventListener('click', () => {
            onUserGesture();
            document.documentElement.requestFullscreen().catch(() => {});
        }, { passive: true });
    </script>
</body>
</html>
