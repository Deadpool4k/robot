<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena - Proiector</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; position: fixed; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .container { text-align: center; }
        .qr-wrapper { background: white; padding: 30px; border-radius: 20px; }
        canvas { width: 300px; height: 300px; }
        h1 { color: white; margin-top: 30px; font-size: 1.5rem; }
        .video-wrapper, .blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .blackout { z-index: 999; }
        .hidden { display: none; }
        .sound-hint {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px;
            font-size: 14px;
            z-index: 2000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="qr-wrapper"><canvas id="qrcode"></canvas></div>
        <h1>SCANEAZĂ PENTRU A INTRĂ ÎN ARENĂ</h1>
    </div>
    <div class="blackout" id="blackout"></div>
    <div class="video-wrapper" id="videoWrapper">
        <video id="eventVideo" preload="auto" playsinline></video>
    </div>
    <div class="sound-hint" id="soundHint">🔊 Atinge ecranul pentru a activa sunetul</div>

    <script>
        const socket = io();
        socket.emit('register', 'projector');

        fetch('/api/qr-data').then(res=>res.json()).then(data=>{
            QRCode.toCanvas(document.getElementById('qrcode'), data.url, { width: 300 });
        });

        const video = document.getElementById('eventVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const blackoutDiv = document.getElementById('blackout');
        const appDiv = document.getElementById('app');
        const soundHint = document.getElementById('soundHint');

        let soundEnabled = false;
        let videoStarted = false;

        fetch('/api/config')
            .then(r => r.json())
            .catch(() => ({}))
            .then(cfg => {
                video.src = cfg.videoUrl || '/0501.mp4';
                video.load();
            });

        function enableSoundAndPlay() {
            if (soundEnabled) return;
            soundEnabled = true;
            video.muted = false;
            soundHint.style.opacity = '0';
            setTimeout(() => { soundHint.style.display = 'none'; }, 500);
            if (videoStarted) {
                video.play().catch(e => console.log('play error:', e));
            }
        }

        function showVideo() {
            videoStarted = true;
            blackoutDiv.style.display = 'none';
            appDiv.classList.add('hidden');
            videoWrapper.style.display = 'block';
            
            if (soundEnabled) {
                video.muted = false;
                video.play().catch(e => console.log('play error:', e));
            } else {
                video.muted = true;
                video.play()
                    .then(() => {
                        // video a pornit fără sunet, așteptăm click pentru sunet
                        soundHint.style.display = 'block';
                    })
                    .catch(e => console.log('autoplay error:', e));
            }
        }

        // activare sunet la primul click pe orice parte a paginii
        document.body.addEventListener('click', enableSoundAndPlay, { once: true });
        document.body.addEventListener('touchstart', enableSoundAndPlay, { once: true });

        socket.on('sync-state', (state) => {
            if (state.blackout) {
                appDiv.classList.add('hidden');
                blackoutDiv.style.display = 'block';
            }
            if (state.videoPlaying) {
                showVideo();
            }
        });

        socket.on('blackout', () => {
            appDiv.classList.add('hidden');
            blackoutDiv.style.display = 'block';
        });

        socket.on('play-video', () => {
            showVideo();
        });

        socket.on('restart', () => {
            appDiv.classList.remove('hidden');
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'none';
            video.pause();
            video.currentTime = 0;
            video.muted = true;
            soundEnabled = false;
            videoStarted = false;
            soundHint.style.display = 'block';
            soundHint.style.opacity = '1';
        });

        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });
    </script>
</body>
</html>
