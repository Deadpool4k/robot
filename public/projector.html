<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena - Proiector</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .qr-wrapper {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
        }
        
        canvas {
            width: 300px;
            height: 300px;
        }
        
        h1 {
            color: white;
            margin-top: 30px;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }
        
        .subtitle {
            color: #888;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        
        .video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1000;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .blackout {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 999;
            display: none;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="qr-wrapper">
            <canvas id="qrcode"></canvas>
        </div>
        <h1>SCANEAZĂ PENTRU A INTRĂ ÎN ARENĂ</h1>
        <div class="subtitle">Pregătește-ți telefonul</div>
    </div>
    
    <div class="blackout" id="blackout"></div>
    <div class="video-wrapper" id="videoWrapper">
        <video id="eventVideo" preload="auto" muted></video>
    </div>
    
    <script>
        const socket = io();
        
        // Register as projector
        socket.emit('register', 'projector');
        
        // Generate QR code linking to /client
        fetch('/api/qr-data')
            .then(res => res.json())
            .then(data => {
                QRCode.toCanvas(document.getElementById('qrcode'), data.url, {
                    width: 300,
                    margin: 2,
                    color: {
                        dark: '#000000',
                        light: '#FFFFFF'
                    }
                }, (error) => {
                    if (error) console.error('QR Error:', error);
                    else console.log('QR generated for:', data.url);
                });
            });
        
        // Get video elements
        const videoWrapper = document.getElementById('videoWrapper');
        const video = document.getElementById('eventVideo');
        const blackoutDiv = document.getElementById('blackout');
        const appContainer = document.querySelector('.container');
        
        // Set video source
        video.src = '/0501.mp4';
        video.load();
        
        // Listen for blackout
        socket.on('blackout', () => {
            console.log('Blackout received');
            // Hide main UI
            appContainer.classList.add('hidden');
            // Show blackout overlay
            blackoutDiv.style.display = 'block';
        });
        
        // Listen for play video
        socket.on('play-video', () => {
            console.log('Play video signal received');
            // Hide blackout
            blackoutDiv.style.display = 'none';
            // Show video wrapper
            videoWrapper.style.display = 'block';
            
            // Attempt to play video
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    console.log('Video playing');
                    // Unmute after play starts
                    setTimeout(() => {
                        video.muted = false;
                    }, 100);
                }).catch(err => {
                    console.error('Play error:', err);
                    // Retry with user interaction simulation
                    document.body.click();
                    setTimeout(() => {
                        video.muted = false;
                        video.play();
                    }, 100);
                });
            }
        });
        
        // Preload readiness
        console.log('Projector ready');
    </script>
</body>
</html>
