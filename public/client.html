<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena - Jucător</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; touch-action: manipulation; }
        .game-container { width: 100%; height: 100%; position: relative; background: linear-gradient(to bottom, #87CEEB, #E0F6FF); overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        .score-board { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 10px; font-size: 24px; font-weight: bold; z-index: 10; }
        .controls-hint { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.5); padding: 10px; font-size: 14px; z-index: 10; }
        .video-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: none; }
        .glitch-shake { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(-3px,2px); } 50% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,3px); } 100% { transform: translate(2px,-3px); } }
        .glitch-flip { transform: scale(1, -1) !important; transition: transform 0.05s; }
        .glitch-color { animation: color-cycle 0.2s infinite; }
        @keyframes color-cycle { 0% { filter: hue-rotate(0deg); } 25% { filter: hue-rotate(90deg); } 50% { filter: hue-rotate(180deg); } 75% { filter: hue-rotate(270deg); } 100% { filter: hue-rotate(360deg); } }
        .invert { filter: invert(1); }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="score-board" id="score">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls-hint">⬅️ STÂNGA | DREAPTA ➡️</div>
    </div>
    <div class="blackout" id="blackout"></div>
    <div class="video-wrapper" id="videoWrapper">
        <video id="eventVideo" preload="auto" playsinline muted></video>
    </div>

    <script>
        // ========== DOODLE JUMP ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, score = 0, gameRunning = true;
        let player = { x: 0, y: 0, width: 30, height: 30, velX: 0, velY: 0, gravity: 0.5, jumpPower: -14 };
        let platforms = [];
        let touchLeft = false, touchRight = false;
        let moveSpeed = 8;
        let controlInverted = false;
        let glitchInterval;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initGame();
        }

        function initGame() {
            player.width = Math.min(40, width * 0.1);
            player.height = player.width;
            player.x = width/2 - player.width/2;
            player.y = height - 150;
            player.velX = 0; player.velY = 0;
            score = 0;
            updateScore();
            platforms = [];
            for (let i = 0; i < Math.floor(height/70); i++) {
                platforms.push({ x: Math.random() * (width - 60), y: height - 50 - i*70, width: 60, height: 15 });
            }
        }

        function updateScore() { document.getElementById('score').innerText = `SCORE: ${Math.floor(score)}`; }


        function handleInput() {
            let move = 0;
            if (touchLeft) move = -moveSpeed;
            if (touchRight) move = moveSpeed;
            if (controlInverted) move = -move;
            player.velX = move;
        }

        function updateGame() {
            if (!gameRunning) return;
            handleInput();
            player.velY += player.gravity;
            player.x += player.velX;
            player.y += player.velY;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > width) player.x = width - player.width;

            player.grounded = false;
            for (let p of platforms) {
                if (player.velY > 0 && player.y + player.height >= p.y && player.y + player.height <= p.y + p.height + 5 &&
                    player.x + player.width > p.x && player.x < p.x + p.width) {
                    player.velY = player.jumpPower;
                    player.y = p.y - player.height;
                }
            }

            if (player.y < height/3) {
                let diff = height/3 - player.y;
                player.y += diff;
                for (let p of platforms) p.y += diff;
                score += diff * 0.5;
                updateScore();
            }

            if (platforms[platforms.length-1]?.y > 0) {
                platforms.push({ x: Math.random() * (width - 60), y: -15, width: 60, height: 15 });
            }
            platforms = platforms.filter(p => p.y < height);
            if (player.y > height) { gameRunning = false; setTimeout(() => { initGame(); gameRunning = true; }, 1000); }
        }

        function draw() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#8B4513';
            for (let p of platforms) ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#FF4444';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function gameLoop() { updateGame(); draw(); requestAnimationFrame(gameLoop); }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let cx = e.touches[0].clientX;
            if (cx < width/2) { touchLeft = true; touchRight = false; }
            else { touchRight = true; touchLeft = false; }
        });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); touchLeft = false; touchRight = false; });

        // GLITCH-URI (MULTE, DAR STABILE)
        function startGlitches() {
            glitchInterval = setInterval(() => {
                if (!gameRunning) return;
                const container = document.querySelector('.game-container');
                const rand = Math.random();
                if (rand < 0.4) { container.classList.add('glitch-shake'); setTimeout(() => container.classList.remove('glitch-shake'), 200); }
                if (rand < 0.3) { document.body.classList.add('invert'); setTimeout(() => document.body.classList.remove('invert'), 400); }
                if (rand < 0.25) { controlInverted = true; setTimeout(() => controlInverted = false, 2000); }
                if (rand < 0.2) { container.classList.add('glitch-flip'); setTimeout(() => container.classList.remove('glitch-flip'), 300); }
                if (rand < 0.25) { container.classList.add('glitch-color'); setTimeout(() => container.classList.remove('glitch-color'), 300); }
                if (rand < 0.15) {
                    container.style.transform = `translate(${Math.random() * 20 - 10}px, ${Math.random() * 20 - 10}px)`;
                    setTimeout(() => container.style.transform = '', 100);
                }
            }, 1500);
        }

        // ========== WEBSOCKET + VIDEO ==========
        const socket = io();
        socket.emit('register', 'client');
        const video = document.getElementById('eventVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const blackoutDiv = document.getElementById('blackout');
        const gameDiv = document.getElementById('gameContainer');

        fetch('/api/config')
            .then(r => r.json())
            .then(cfg => {
                const url = (cfg?.videoUrl || '/0501.mp4').toString();
                video.src = encodeURI(url);
                video.load();
            })
            .catch(() => {
                video.src = '/0501.mp4';
                video.load();
            });

        let pendingVideoPlay = false;
        function showVideo() {
            // Stop game + visual effects while video plays (prevents GPU overload/freezes)
            gameRunning = false;
            if (glitchInterval) {
                clearInterval(glitchInterval);
                glitchInterval = undefined;
            }
            document.body.classList.remove('invert');
            const container = document.querySelector('.game-container');
            if (container) {
                container.classList.remove('glitch-shake', 'glitch-flip', 'glitch-color');
                container.style.transform = '';
            }

            pendingVideoPlay = true;
            blackoutDiv.style.display = 'none';
            gameDiv.style.display = 'none';
            videoWrapper.style.display = 'block';
            video.muted = true; // autoplay-friendly + cerința: fără sunet

            const tryPlay = () => video.play().then(() => { pendingVideoPlay = false; }).catch(() => {});
            tryPlay();

            // If autoplay is blocked, retry on first user interaction.
            const resume = () => {
                if (!pendingVideoPlay) return;
                tryPlay();
            };
            document.body.addEventListener('click', resume, { once: true, passive: true });
            document.body.addEventListener('touchstart', resume, { once: true, passive: true });
        }

        // Recover from buffering stalls on unstable networks/devices
        let lastRecoverAt = 0;
        function recoverVideoPlayback() {
            const now = Date.now();
            if (now - lastRecoverAt < 1500) return;
            lastRecoverAt = now;
            if (videoWrapper.style.display !== 'block') return;
            video.muted = true;
            video.play().catch(() => {
                // As a last resort, reload the stream and try again
                try {
                    video.load();
                    video.play().catch(() => {});
                } catch {}
            });
        }
        video.addEventListener('stalled', recoverVideoPlayback);
        video.addEventListener('waiting', recoverVideoPlayback);
        video.addEventListener('error', recoverVideoPlayback);

        socket.on('sync-state', (state) => {
            if (state.blackout) {
                gameDiv.style.display = 'none';
                blackoutDiv.style.display = 'block';
                gameRunning = false;
            } else {
                blackoutDiv.style.display = 'none';
            }

            if (state.videoPlaying) {
                showVideo();
            } else {
                videoWrapper.style.display = 'none';
            }
        });

        socket.on('blackout', () => {
            gameDiv.style.display = 'none';
            blackoutDiv.style.display = 'block';
            gameRunning = false;
        });

        socket.on('play-video', () => {
            showVideo();
        });

        socket.on('restart', () => {
            console.log('Restart primit');
            gameRunning = true;
            gameDiv.style.display = 'block';
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'none';
            video.pause();
            video.currentTime = 0;
            video.muted = true;
            initGame();
            if (!glitchInterval) startGlitches();
        });

        function goFull() {
            const el = document.documentElement;
            if (document.fullscreenElement) return;
            if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        }
        document.body.addEventListener('click', goFull);
        document.body.addEventListener('touchstart', goFull);

        resize();
        window.addEventListener('resize', resize);
        gameLoop();
        startGlitches();
    </script>
</body>
</html>
