<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena - Jucător</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; touch-action: manipulation; }
        .game-container { width: 100%; height: 100%; position: relative; background: linear-gradient(to bottom, #87CEEB, #E0F6FF); overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        .score-board { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 10px; font-size: 24px; font-weight: bold; z-index: 10; }
        .controls-hint { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.6); background: rgba(0,0,0,0.5); padding: 10px; font-size: 14px; z-index: 10; }
        .video-wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: none; }
        .glitch-shake { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(-3px,2px); } 50% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,3px); } 100% { transform: translate(2px,-3px); } }
        .glitch-flip { transform: scale(1, -1) !important; transition: transform 0.05s; }
        .glitch-color { animation: color-cycle 0.2s infinite; }
        @keyframes color-cycle { 0% { filter: hue-rotate(0deg); } 25% { filter: hue-rotate(90deg); } 50% { filter: hue-rotate(180deg); } 75% { filter: hue-rotate(270deg); } 100% { filter: hue-rotate(360deg); } }
        .invert { filter: invert(1); }
        .glitch-dark-tone { filter: brightness(0.45) contrast(1.45) saturate(0.55) hue-rotate(160deg); }
        .glitch-rgb { filter: contrast(1.2) saturate(1.4) drop-shadow(4px 0 rgba(255,0,0,0.6)) drop-shadow(-4px 0 rgba(0,255,255,0.6)); }
        .glitch-zoom { animation: zoom-pulse 0.18s ease-in-out 2; }
        @keyframes zoom-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
        .glitch-scanlines {
            background-image: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.06) 0px,
                rgba(255,255,255,0.06) 1px,
                transparent 2px,
                transparent 4px
            );
            background-size: 100% 4px;
            animation: scanline-shift 0.12s linear infinite;
        }
        @keyframes scanline-shift { from { background-position-y: 0; } to { background-position-y: 8px; } }
        .glitch-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2000;
            opacity: 0;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.2), transparent 40%),
                              radial-gradient(circle at 80% 65%, rgba(255,255,255,0.16), transparent 38%),
                              repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
            mix-blend-mode: screen;
            transition: opacity 0.08s linear;
        }
        .glitch-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 2100;
            opacity: 0;
            transition: opacity 0.18s ease;
            mix-blend-mode: lighten;
            filter: contrast(1.25) saturate(0.7);
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="score-board" id="score">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls-hint">⬅️ STÂNGA | DREAPTA ➡️</div>
    </div>
    <div class="blackout" id="blackout"></div>
    <div class="glitch-overlay" id="glitchOverlay"></div>
    <img id="glitchImage" class="glitch-image" src="/glitch-image.png" alt="glitch effect" />
    <div class="video-wrapper" id="videoWrapper">
        <video id="eventVideo" preload="auto" playsinline muted></video>
    </div>

    <script>
        // ========== DOODLE JUMP ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, score = 0, gameRunning = true;
        let player = { x: 0, y: 0, width: 30, height: 30, velX: 0, velY: 0, gravity: 0.5, jumpPower: -14 };
        let platforms = [];
        let touchLeft = false, touchRight = false;
        let moveSpeed = 8;
        let controlInverted = false;
        let glitchInterval;
        let glitchRunning = false;
        let glitchBurstCount = 0;
        const MAX_BURSTS = 3;
        const glitchTimers = new Set();
        const PLATFORM_GAP = 82;
        const PLATFORM_MIN = 7;
        let platformTopY = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initGame();
        }

        function initGame() {
            player.width = Math.min(40, width * 0.1);
            player.height = player.width;
            player.x = width/2 - player.width/2;
            player.y = height - 150;
            player.velX = 0;
            player.velY = 1;
            score = 0;
            updateScore();
            platforms = [];
            const basePlatformCount = Math.max(PLATFORM_MIN, Math.floor(height / PLATFORM_GAP));
            for (let i = 0; i < basePlatformCount; i++) {
                const pWidth = 52 + Math.random() * 18;
                platforms.push({
                    x: Math.random() * Math.max(1, (width - pWidth)),
                    y: height - 50 - i * PLATFORM_GAP,
                    width: pWidth,
                    height: 14
                });
            }
            // Guaranteed starter platform under the player so game always starts playable.
            const starterWidth = 120;
            platforms.push({
                x: Math.max(0, Math.min(width - starterWidth, player.x + player.width / 2 - starterWidth / 2)),
                y: player.y + player.height + 10,
                width: starterWidth,
                height: 14
            });
            platformTopY = platforms[platforms.length - 1]?.y || 0;
        }

        function updateScore() { document.getElementById('score').innerText = `SCORE: ${Math.floor(score)}`; }


        function handleInput() {
            let move = 0;
            if (touchLeft) move = -moveSpeed;
            if (touchRight) move = moveSpeed;
            if (controlInverted) move = -move;
            player.velX = move;
        }

        function updateGame() {
            if (!gameRunning) return;
            handleInput();
            player.velY += player.gravity;
            player.x += player.velX;
            player.y += player.velY;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > width) player.x = width - player.width;

            player.grounded = false;
            for (let p of platforms) {
                if (player.velY > 0 && player.y + player.height >= p.y && player.y + player.height <= p.y + p.height + 5 &&
                    player.x + player.width > p.x && player.x < p.x + p.width) {
                    player.velY = player.jumpPower;
                    player.y = p.y - player.height;
                }
            }

            if (player.y < height/3) {
                let diff = height/3 - player.y;
                player.y += diff;
                for (let p of platforms) p.y += diff;
                score += diff * 0.5;
                updateScore();
            }

            while (platformTopY > -PLATFORM_GAP) {
                platformTopY -= PLATFORM_GAP;
                const pWidth = 50 + Math.random() * 20;
                platforms.push({
                    x: Math.random() * Math.max(1, (width - pWidth)),
                    y: platformTopY,
                    width: pWidth,
                    height: 14
                });
            }
            platforms = platforms.filter(p => p.y < height);
            platformTopY = platforms.reduce((minY, p) => Math.min(minY, p.y), height);
            if (player.y > height) { gameRunning = false; setTimeout(() => { initGame(); gameRunning = true; }, 1000); }
        }

        function draw() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#8B4513';
            for (let p of platforms) ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = '#FF4444';
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function gameLoop() { updateGame(); draw(); requestAnimationFrame(gameLoop); }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let cx = e.touches[0].clientX;
            if (cx < width/2) { touchLeft = true; touchRight = false; }
            else { touchRight = true; touchLeft = false; }
        });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); touchLeft = false; touchRight = false; });

        const glitchOverlay = document.getElementById('glitchOverlay');
        const glitchImage = document.getElementById('glitchImage');

        function registerTimer(timerId) {
            glitchTimers.add(timerId);
            return timerId;
        }

        function unregisterTimer(timerId) {
            glitchTimers.delete(timerId);
        }

        function clearVisualGlitches() {
            const container = document.querySelector('.game-container');
            if (container) {
                container.classList.remove(
                    'glitch-shake',
                    'glitch-flip',
                    'glitch-color',
                    'glitch-dark-tone',
                    'glitch-rgb',
                    'glitch-zoom',
                    'glitch-scanlines'
                );
                container.style.transform = '';
            }
            document.body.classList.remove('invert');
            if (glitchOverlay) glitchOverlay.style.opacity = '0';
            if (glitchImage) glitchImage.style.opacity = '0';
            controlInverted = false;
        }

        function glitchFlash(duration = 120) {
            if (!glitchOverlay) return;
            glitchOverlay.style.opacity = `${0.35 + Math.random() * 0.45}`;
            const timer = registerTimer(setTimeout(() => {
                glitchOverlay.style.opacity = '0';
                unregisterTimer(timer);
            }, duration));
        }

        function applyClassGlitch(className, duration = 200) {
            const container = document.querySelector('.game-container');
            if (!container) return;
            container.classList.add(className);
            const timer = registerTimer(setTimeout(() => {
                container.classList.remove(className);
                unregisterTimer(timer);
            }, duration));
        }

        function showGlitchImage(duration = 900) {
            if (!glitchImage) return;
            glitchImage.style.opacity = `${0.35 + Math.random() * 0.5}`;
            const timer = registerTimer(setTimeout(() => {
                glitchImage.style.opacity = '0';
                unregisterTimer(timer);
            }, duration));
        }

        function triggerGlitchBurst() {
            if (!glitchRunning || !gameRunning) return;
            if (glitchBurstCount >= MAX_BURSTS) return;
            glitchBurstCount++;

            const container = document.querySelector('.game-container');
            const rand = Math.random();
            if (rand < 0.12) applyClassGlitch('glitch-shake', 180 + Math.random() * 160);
            else if (rand < 0.24) applyClassGlitch('glitch-color', 250 + Math.random() * 300);
            else if (rand < 0.36) applyClassGlitch('glitch-rgb', 220 + Math.random() * 260);
            else if (rand < 0.48) applyClassGlitch('glitch-scanlines', 350 + Math.random() * 420);
            else if (rand < 0.58) applyClassGlitch('glitch-zoom', 220 + Math.random() * 160);
            else if (rand < 0.68) applyClassGlitch('glitch-dark-tone', 3000); // dark colors for 3 seconds
            else if (rand < 0.78) applyClassGlitch('glitch-flip', 2000); // upside-down for 2 seconds
            else if (rand < 0.88) {
                controlInverted = true;
                const timer = registerTimer(setTimeout(() => {
                    controlInverted = false;
                    unregisterTimer(timer);
                }, 2000 + Math.random() * 1200));
            } else {
                if (container) {
                    container.style.transform = `translate(${Math.random() * 24 - 12}px, ${Math.random() * 24 - 12}px) skew(${Math.random() * 4 - 2}deg)`;
                    const timer = registerTimer(setTimeout(() => {
                        container.style.transform = '';
                        unregisterTimer(timer);
                    }, 90 + Math.random() * 130));
                }
            }

            if (Math.random() < 0.65) glitchFlash(80 + Math.random() * 160);
            if (Math.random() < 0.25) showGlitchImage(900 + Math.random() * 700);

            const releaseTimer = registerTimer(setTimeout(() => {
                glitchBurstCount = Math.max(0, glitchBurstCount - 1);
                unregisterTimer(releaseTimer);
            }, 350));
        }

        function scheduleNextGlitch() {
            if (!glitchRunning) return;
            const delay = 250 + Math.random() * 520; // frequent glitch cadence
            glitchInterval = registerTimer(setTimeout(() => {
                triggerGlitchBurst();
                unregisterTimer(glitchInterval);
                scheduleNextGlitch();
            }, delay));
        }

        function startGlitches() {
            if (glitchRunning) return;
            glitchRunning = true;
            scheduleNextGlitch();
        }

        function stopGlitches() {
            glitchRunning = false;
            if (glitchInterval) {
                clearTimeout(glitchInterval);
                unregisterTimer(glitchInterval);
                glitchInterval = undefined;
            }
            glitchTimers.forEach((t) => clearTimeout(t));
            glitchTimers.clear();
            glitchBurstCount = 0;
            clearVisualGlitches();
        }

        // ========== WEBSOCKET + VIDEO ==========
        const socket = io();
        socket.emit('register', 'client');
        const video = document.getElementById('eventVideo');
        const videoWrapper = document.getElementById('videoWrapper');
        const blackoutDiv = document.getElementById('blackout');
        const gameDiv = document.getElementById('gameContainer');

        fetch('/api/config')
            .then(r => r.json())
            .then(cfg => {
                const url = (cfg?.videoUrl || '').toString().trim();
                if (!url) {
                    console.warn('VIDEO_URL missing; video playback disabled until configured on server.');
                    return;
                }
                video.src = encodeURI(url);
                video.load();
            })
            .catch(() => {
                console.warn('Could not load video config.');
            });

        let pendingVideoPlay = false;
        let playbackWatchdog = null;
        let lastVideoTime = 0;
        let lastProgressAt = 0;
        function startPlaybackWatchdog() {
            if (playbackWatchdog) return;
            lastVideoTime = video.currentTime || 0;
            lastProgressAt = Date.now();
            playbackWatchdog = setInterval(() => {
                if (videoWrapper.style.display !== 'block') return;
                const now = Date.now();
                const current = video.currentTime || 0;
                if (current > lastVideoTime + 0.02) {
                    lastVideoTime = current;
                    lastProgressAt = now;
                    return;
                }
                // If video time is stuck for >1.2s, nudge forward and force play.
                if (now - lastProgressAt > 1200) {
                    try { video.currentTime = Math.max(0, current + 0.05); } catch {}
                    video.play().catch(() => {});
                    lastProgressAt = now;
                }
            }, 300);
        }
        function stopPlaybackWatchdog() {
            if (!playbackWatchdog) return;
            clearInterval(playbackWatchdog);
            playbackWatchdog = null;
        }
        function syncVideoPosition(targetTime, force = false) {
            if (!Number.isFinite(targetTime) || targetTime < 0) return;
            const drift = Math.abs((video.currentTime || 0) - targetTime);
            if (force || drift > 0.35) {
                try {
                    video.currentTime = targetTime;
                } catch {}
            }
        }
        function showVideo(startTime = 0) {
            if (!video.src) {
                console.warn('play-video ignored: no configured video source.');
                return;
            }
            // Stop game + visual effects while video plays (prevents GPU overload/freezes)
            gameRunning = false;
            stopGlitches();

            pendingVideoPlay = true;
            blackoutDiv.style.display = 'none';
            gameDiv.style.display = 'none';
            videoWrapper.style.display = 'block';
            syncVideoPosition(startTime, true);
            video.muted = true; // autoplay-friendly + cerinta: fara sunet pe telefon
            video.volume = 0;
            startPlaybackWatchdog();

            const tryPlay = () => video.play().then(() => { pendingVideoPlay = false; }).catch(() => {});
            tryPlay();

            // If autoplay is blocked, retry on first user interaction.
            const resume = () => {
                if (!pendingVideoPlay) return;
                tryPlay();
            };
            document.body.addEventListener('click', resume, { once: true, passive: true });
            document.body.addEventListener('touchstart', resume, { once: true, passive: true });
        }

        // Recover from buffering stalls on unstable networks/devices
        let lastRecoverAt = 0;
        function recoverVideoPlayback() {
            const now = Date.now();
            if (now - lastRecoverAt < 1500) return;
            lastRecoverAt = now;
            if (videoWrapper.style.display !== 'block') return;
            video.muted = true;
            video.play().catch(() => {
                // As a last resort, reload the stream and try again
                try {
                    video.load();
                    video.play().catch(() => {});
                } catch {}
            });
        }
        video.addEventListener('stalled', recoverVideoPlayback);
        video.addEventListener('waiting', recoverVideoPlayback);
        video.addEventListener('error', recoverVideoPlayback);
        video.addEventListener('volumechange', () => {
            // Enforce silent playback on client devices even if browser toggles state.
            if (!video.muted || video.volume !== 0) {
                video.muted = true;
                video.volume = 0;
            }
        });

        socket.on('sync-state', (state) => {
    console.log('Sync state:', state);
    if (state.blackout) {
        gameDiv.style.display = 'none';
        blackoutDiv.style.display = 'block';
        gameRunning = false;
    } else {
        blackoutDiv.style.display = 'none';
    }

    if (state.videoPlaying) {
        const targetTime = state.videoTime || 0;
        if (videoWrapper.style.display !== 'block' || video.paused) {
            showVideo(targetTime);
        } else {
            syncVideoPosition(targetTime, false);
        }
    } else {
        videoWrapper.style.display = 'none';
        stopPlaybackWatchdog();
        // Ensure gameplay resumes when server is in idle state.
        if (!state.blackout) {
            gameDiv.style.display = 'block';
            gameRunning = true;
            if (!glitchRunning) startGlitches();
        }
    }
});

        socket.on('blackout', () => {
            gameDiv.style.display = 'none';
            blackoutDiv.style.display = 'block';
            gameRunning = false;
        });

        socket.on('play-video', (payload = {}) => {
            showVideo(payload.time || 0);
        });

        socket.on('restart', () => {
            console.log('Restart primit');
            gameRunning = true;
            gameDiv.style.display = 'block';
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'none';
            stopPlaybackWatchdog();
            video.pause();
            video.currentTime = 0;
            video.muted = true;
            initGame();
            startGlitches();
        });

        function goFull() {
            const el = document.documentElement;
            if (document.fullscreenElement) return;
            if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        }
        document.body.addEventListener('click', goFull);
        document.body.addEventListener('touchstart', goFull);

        resize();
        window.addEventListener('resize', resize);
        gameLoop();
        startGlitches();
    </script>
</body>
</html>
