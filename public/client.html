<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arena - Jucător</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; position: fixed; width: 100%; height: 100%; overflow: hidden; font-family: monospace; }
        
        .game-container { width: 100%; height: 100%; position: relative; background: linear-gradient(to bottom, #87CEEB, #E0F6FF); }
        canvas { width: 100%; height: 100%; display: block; }
        .score { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 10px; font-size: 24px; z-index: 10; }
        .hint { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: white; background: rgba(0,0,0,0.5); padding: 10px; z-index: 10; }
        
        .video-wrapper, .blackout { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1000; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .blackout { z-index: 999; }
        
        /* Glitch effects */
        .shake { animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(-3px,2px); } 50% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,3px); } 100% { transform: translate(2px,-3px); } }
        .flip { transform: scale(1, -1) !important; }
        .invert { filter: invert(1); }
        .color-cycle { animation: color-cycle 0.2s infinite; }
        @keyframes color-cycle { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
    </style>
</head>
<body>
    <div class="game-container" id="game">
        <div class="score" id="score">SCORE: 0</div>
        <canvas id="canvas"></canvas>
        <div class="hint">⬅️ STÂNGA | DREAPTA ➡️</div>
    </div>
    <div class="blackout" id="blackout"></div>
    <div class="video-wrapper" id="videoWrapper">
        <video id="video" preload="auto" playsinline></video>
    </div>

    <script>
        // ========== DOODLE JUMP ==========
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, score = 0, running = true;
        
        let player = { x: 0, y: 0, w: 30, h: 30, vx: 0, vy: 0, gravity: 0.5, jump: -14 };
        let platforms = [];
        let left = false, right = false;
        let inverted = false;
        
        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
            init();
        }
        
        function init() {
            player.w = Math.min(40, w * 0.1);
            player.h = player.w;
            player.x = w/2 - player.w/2;
            player.y = h - 150;
            player.vx = 0;
            player.vy = 0;
            score = 0;
            document.getElementById('score').innerText = 'SCORE: 0';
            platforms = [];
            for(let i = 0; i < Math.floor(h/70); i++) {
                platforms.push({ x: Math.random() * (w - 60), y: h - 50 - i*70, w: 60, h: 15 });
            }
        }
        
        function update() {
            if(!running) return;
            let move = 0;
            if(left) move = -8;
            if(right) move = 8;
            if(inverted) move = -move;
            player.vx = move;
            
            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;
            
            if(player.x < 0) player.x = 0;
            if(player.x + player.w > w) player.x = w - player.w;
            
            for(let p of platforms) {
                if(player.vy > 0 && player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 5 &&
                    player.x + player.w > p.x && player.x < p.x + p.w) {
                    player.vy = player.jump;
                    player.y = p.y - player.h;
                }
            }
            
            if(player.y < h/3) {
                let diff = h/3 - player.y;
                player.y += diff;
                for(let p of platforms) p.y += diff;
                score += diff * 0.5;
                document.getElementById('score').innerText = `SCORE: ${Math.floor(score)}`;
            }
            
            if(platforms[platforms.length-1]?.y > 0) {
                platforms.push({ x: Math.random() * (w - 60), y: -15, w: 60, h: 15 });
            }
            platforms = platforms.filter(p => p.y < h);
            if(player.y > h) { running = false; setTimeout(() => { init(); running = true; }, 1000); }
        }
        
        function draw() {
            ctx.clearRect(0, 0, w, h);
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#87CEEB');
            grad.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#8B4513';
            for(let p of platforms) ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#FF4444';
            ctx.fillRect(player.x, player.y, player.w, player.h);
        }
        
        function loop() { update(); draw(); requestAnimationFrame(loop); }
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let cx = e.touches[0].clientX;
            if(cx < w/2) { left = true; right = false; }
            else { right = true; left = false; }
        });
        canvas.addEventListener('touchend', (e) => { left = false; right = false; });
        
        // Glitches
        setInterval(() => {
            if(!running) return;
            const game = document.getElementById('game');
            let r = Math.random();
            if(r < 0.3) { game.classList.add('shake'); setTimeout(() => game.classList.remove('shake'), 200); }
            if(r < 0.2) { document.body.classList.add('invert'); setTimeout(() => document.body.classList.remove('invert'), 400); }
            if(r < 0.2) { inverted = true; setTimeout(() => inverted = false, 2000); }
            if(r < 0.15) { game.classList.add('flip'); setTimeout(() => game.classList.remove('flip'), 300); }
            if(r < 0.15) { game.classList.add('color-cycle'); setTimeout(() => game.classList.remove('color-cycle'), 300); }
        }, 1500);
        
        // ========== VIDEO ==========
        const socket = io();
        socket.emit('register', 'client');
        
        const video = document.getElementById('video');
        const videoWrapper = document.getElementById('videoWrapper');
        const blackoutDiv = document.getElementById('blackout');
        const gameDiv = document.getElementById('game');
        
        video.src = '/0501.mp4';
        video.load();
        
        socket.on('state', (state) => {
            console.log('State:', state);
            if(state.blackout) {
                gameDiv.style.display = 'none';
                blackoutDiv.style.display = 'block';
                running = false;
            }
            if(state.videoPlaying) {
                blackoutDiv.style.display = 'none';
                videoWrapper.style.display = 'block';
                video.play().catch(e => console.log(e));
            }
        });
        
        socket.on('blackout', () => {
            gameDiv.style.display = 'none';
            blackoutDiv.style.display = 'block';
            running = false;
        });
        
        socket.on('play-video', () => {
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'block';
            video.play().catch(e => console.log(e));
        });
        
        socket.on('restart', () => {
            running = true;
            gameDiv.style.display = 'block';
            blackoutDiv.style.display = 'none';
            videoWrapper.style.display = 'none';
            video.pause();
            video.currentTime = 0;
            init();
        });
        
        // Forțează play pe telefon (cheia)
        document.body.addEventListener('touchstart', () => {
            video.play().catch(e => console.log('Pre-play error:', e));
        }, { once: true });
        
        resize();
        window.addEventListener('resize', resize);
        loop();
    </script>
</body>
</html>
