<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: monospace; }
        .panel { background: #222; padding: 40px; border-radius: 20px; text-align: center; }
        button { background: red; color: white; border: none; padding: 20px 40px; font-size: 20px; margin: 10px; cursor: pointer; border-radius: 50px; }
        .restart { background: #444; }
        .status { color: #0f0; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1 style="color:red">CONTROL ARENA</h1>
        <div class="status" id="status">🟢 CONECTAT</div>
        <button id="start">▶ START</button>
        <button id="restart" class="restart">⟳ RESTART</button>
    </div>
    <script>
        const socket = io();
        socket.emit('register', 'admin');
        socket.on('connect', () => document.getElementById('status').innerHTML = '🟢 CONECTAT');
        
        document.getElementById('start').onclick = () => {
            if(confirm('START BLACKOUT + VIDEO?')) socket.emit('start');
        };
        document.getElementById('restart').onclick = () => {
            if(confirm('RESTART TOTUL?')) socket.emit('restart');
        };
    </script>
</body>
</html>
